<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vending Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;background:#f0ede8;min-height:100vh;padding-bottom:80px}
h1{font-size:20px;font-weight:700;margin-bottom:1rem}
h2{font-size:16px;font-weight:600;margin-bottom:.75rem}
h3{font-size:14px;font-weight:600;margin-bottom:.5rem}
.container{max-width:700px;margin:0 auto;padding:1rem}
.card{background:#fff;border:1px solid #e0ddd5;border-radius:14px;padding:1rem;margin-bottom:.75rem}
label{font-size:12px;color:#666;display:block;margin-bottom:4px;font-weight:500}
select,input[type="text"],input[type="number"],input[type="date"]{padding:10px 12px;border-radius:10px;border:1.5px solid #ddd;background:#fff;color:#1a1a1a;font-size:16px;font-family:inherit;width:100%;outline:none;-webkit-appearance:none;appearance:none}
select:focus,input:focus{border-color:#1a6fc4;box-shadow:0 0 0 3px rgba(26,111,196,.12)}
button{padding:11px 18px;border-radius:10px;border:1.5px solid #ddd;background:#fff;cursor:pointer;font-size:15px;font-family:inherit;color:#1a1a1a;font-weight:500;transition:all .15s;min-height:44px}
button:active{opacity:.75;transform:scale(.97)}
button.primary{background:#1a6fc4;color:#fff;border-color:#1a6fc4}
button.success{background:#2d7a2d;color:#fff;border-color:#2d7a2d}
button.warning{background:#d4680a;color:#fff;border-color:#d4680a}
button.sm{padding:7px 12px;font-size:13px;min-height:36px}
button.danger-solid{background:#c0392b;color:#fff;border-color:#c0392b;padding:7px 12px;font-size:13px;min-height:36px}
button.full{width:100%;margin-bottom:8px}
button:disabled{opacity:.5}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0ddd5;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 2px;border:none;background:transparent;cursor:pointer;color:#888;font-size:9px;font-weight:500;gap:2px;min-height:56px}
.nav-btn.active{color:#1a6fc4}
.nav-icon{font-size:18px;line-height:1}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.75rem}
.stat{background:#f4f4f0;border-radius:10px;padding:.65rem .85rem}
.stat-label{font-size:11px;color:#888;margin-bottom:2px}
.stat-value{font-size:20px;font-weight:700}
.slot-card{background:#f9f8f6;border:1.5px solid #e8e4de;border-radius:12px;padding:.85rem;margin-bottom:.65rem}
.slot-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.slot-label-tag{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.input-group label{font-size:11px;color:#666;margin-bottom:3px}
.arrival-inp{background:#f0f7ee!important;border-color:#b8ddb0!important}
.restock-inp{background:#e8f3ff!important;border-color:#a8cff0!important}
.calc-row{display:flex;gap:6px;margin-top:6px;background:#f4f4f0;border-radius:8px;padding:6px 8px}
.calc-item{flex:1;text-align:center}
.calc-label{font-size:10px;color:#888;margin-bottom:1px}
.calc-val{font-size:14px;font-weight:700}
.prev-tag{font-size:10px;color:#aaa;display:block;margin-top:2px;text-align:center}
.green{color:#1a6b2a;font-weight:700}
.red{color:#a32d2d;font-weight:700}
.orange{color:#d4680a;font-weight:700}
.muted{color:#888}
.history-card{background:#fff;border:1px solid #e0ddd5;border-radius:14px;padding:1rem;margin-bottom:.75rem}
.history-item-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f0ede8;font-size:13px}
.history-item-row:last-child{border-bottom:none}
.qty-badge{padding:2px 7px;border-radius:6px;font-size:12px;font-weight:600}
.qty-arr{background:#f0f7ee;color:#2d6b20}
.qty-rst{background:#e8f3ff;color:#1a5c9e}
.qty-sold{background:#fff3cd;color:#7a5200}
.bar-wrap{background:#e8e6e0;border-radius:4px;height:6px;overflow:hidden;margin-top:4px}
.bar{height:6px;border-radius:4px}
.badge{display:inline-block;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:600;margin-left:4px}
.badge-top{background:#d4edda;color:#1a6b2a}
.badge-low{background:#fde8e8;color:#a32d2d}
.monthly-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0ede8;font-size:13px;gap:8px}
.monthly-row:last-child{border-bottom:none}
.inv-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0ede8;gap:8px}
.inv-row:last-child{border-bottom:none}
.stock-badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:600}
.stock-ok{background:#d4edda;color:#1a6b2a}
.stock-low{background:#fff3cd;color:#856404}
.stock-out{background:#fde8e8;color:#a32d2d}
.log-row{padding:8px 0;border-bottom:1px solid #f0ede8;font-size:13px}
.log-row:last-child{border-bottom:none}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0ede8;gap:8px}
.item-row:last-child{border-bottom:none}
.cat-pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.cat-drink{background:#e8f3ff;color:#1a5c9e}
.cat-snack{background:#fff3cd;color:#7a5200}
.status-bar{border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:.75rem;display:none}
.status-bar.error{background:#fde8e8;border:1px solid #c0392b;display:block}
.status-bar.success{background:#d4edda;border:1px solid #2d7a2d;display:block}
.status-bar.info{background:#e8f3ff;border:1px solid #1a6fc4;display:block}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 22px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.note-bar{background:#fff8e1;border:1px solid #f0c040;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:.75rem}
.flex-row{display:flex;gap:8px}
.flex-row button{flex:1}
.section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0ede8;font-size:13px;gap:8px}
.total-row:last-child{border-bottom:none}
@media(min-width:650px){
  .mobile-cards{display:none}
  .desktop-table-wrap{display:block}
  table{width:100%;border-collapse:collapse;font-size:13px;table-layout:auto;min-width:700px}
  thead th{font-weight:600;font-size:11px;color:#666;text-align:left;padding:6px 5px;border-bottom:1px solid #ddd;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
  tbody td{padding:5px;vertical-align:middle;border-bottom:1px solid #f0ede8}
  tbody tr:last-child td{border-bottom:none}
  tfoot td{padding:6px 5px;border-top:1px solid #ddd;font-weight:600}
  .arrival-col{background:#f0f7ee}
  .restock-col{background:#e8f3ff}
  .overflow{overflow-x:auto}
  .desktop-table-wrap table select{min-width:140px;font-size:12px}
  .desktop-table-wrap table input{font-size:12px}
  .bottom-nav{display:none}
  .desktop-tabs{display:flex!important}
  body{padding-bottom:0}
}
@media(max-width:649px){
  .mobile-cards{display:block}
  .desktop-table-wrap{display:none}
  .desktop-tabs{display:none!important}
}
.desktop-tabs{display:none;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
.dtab{padding:8px 16px;border-radius:10px;border:1.5px solid #ddd;background:#fff;cursor:pointer;font-size:13px;color:#666;font-weight:500}
.dtab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
</style>
</head>
<body>
<div class="container">
  <div id="statusBar" class="status-bar"></div>
  <h1>&#x1F3EA; Vending Tracker</h1>

  <div class="desktop-tabs">
    <button class="dtab active" onclick="showTab('sheet')" id="dtab-sheet">&#x1F4CB; Visit Sheet</button>
    <button class="dtab" onclick="showTab('history')" id="dtab-history">&#x1F4C5; History</button>
    <button class="dtab" onclick="showTab('monthly')" id="dtab-monthly">&#x1F4CA; Monthly</button>
    <button class="dtab" onclick="showTab('inventory')" id="dtab-inventory">&#x1F4E6; Inventory</button>
    <button class="dtab" onclick="showTab('items')" id="dtab-items">&#x1F4DD; Items</button>
    <button class="dtab" onclick="showTab('locations')" id="dtab-locations">&#x1F4CD; Locations</button>
  </div>

  <!-- VISIT SHEET -->
  <div id="pane-sheet">
    <div class="card">
      <div class="grid-2" style="margin-bottom:10px">
        <div><label>Location</label><select id="locSel" onchange="switchLoc()"></select></div>
        <div><label>Visit date</label><input type="date" id="visitDate"/></div>
      </div>
    </div>
    <div id="prevRestockNote" class="note-bar" style="display:none"></div>
    <div class="mobile-cards" id="slotCardsMobile"></div>
    <div class="desktop-table-wrap">
      <div class="card">
        <div class="overflow">
          <table>
            <colgroup><col style="width:70px"><col style="min-width:160px"><col style="width:72px"><col style="width:72px"><col style="width:64px"><col style="width:64px"><col style="width:50px"><col style="width:72px"><col style="width:72px"><col style="width:32px"></colgroup>
            <thead><tr>
              <th>Slot</th><th>Item</th>
              <th style="text-align:center;background:#f0f7ee">Arrival<br><span style="font-size:9px;font-weight:400">(left)</span></th>
              <th style="text-align:center;background:#e8f3ff">Restock<br><span style="font-size:9px;font-weight:400">(filled to)</span></th>
              <th style="text-align:right">Price</th><th style="text-align:right">Cost</th>
              <th style="text-align:center">Sold</th><th style="text-align:right">Revenue</th><th style="text-align:right">Profit</th><th></th>
            </tr></thead>
            <tbody id="slotBody"></tbody>
            <tfoot><tr>
              <td colspan="6" class="muted" style="font-size:12px">Totals</td>
              <td id="tot-sold" style="text-align:center"></td>
              <td id="tot-rev" style="text-align:right"></td>
              <td id="tot-profit" style="text-align:right"></td>
              <td></td>
            </tr></tfoot>
          </table>
        </div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button onclick="addSlot()" style="border-style:dashed">+ Add Slot</button>
      <div class="flex-row">
        <button class="primary" onclick="saveSheet()">&#x1F4BE; Save Sheet</button>
        <button class="success" onclick="submitReport()" id="submitBtn">&#x1F4C4; Submit Report</button>
      </div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="pane-history" style="display:none">
    <div style="margin-bottom:.75rem"><label>Filter by location</label><select id="histLoc" onchange="renderHistory()"></select></div>
    <div id="historyList"><p class="muted" style="font-size:13px">Loading...</p></div>
  </div>

  <!-- MONTHLY -->
  <div id="pane-monthly" style="display:none">
    <div class="grid-2" style="margin-bottom:.75rem">
      <div><label>Month</label><select id="monthSel" onchange="renderMonthly()"></select></div>
      <div><label>Location</label><select id="monthLoc" onchange="renderMonthly()"></select></div>
    </div>
    <div id="monthlyContent"></div>
  </div>

  <!-- INVENTORY -->
  <div id="pane-inventory" style="display:none">
    <div class="card">
      <div class="section-hdr">
        <h3 style="margin-bottom:0">&#x1F4E6; Total inventory</h3>
        <span id="invLowCount" style="font-size:12px;color:#a32d2d;font-weight:600;display:none"></span>
      </div>
      <div id="totalStockList"><p class="muted" style="font-size:13px">No inventory yet.</p></div>
    </div>
  </div>

  <!-- MASTER ITEMS -->
  <div id="pane-items" style="display:none">
    <div class="card">
      <h3 style="margin-bottom:.75rem" id="itemFormTitle">&#x2795; Add new item</h3>
      <div class="grid-2" style="margin-bottom:8px">
        <div><label>Item name</label><input type="text" id="masterName" placeholder="e.g. Coke Can 12oz"/></div>
        <div><label>Category</label><select id="masterCat"><option value="drink">Drink</option><option value="snack">Snack</option></select></div>
      </div>
      <div class="grid-3" style="margin-bottom:10px">
        <div><label>Default sell price ($)</label><input type="number" id="masterPrice" placeholder="2.00" step="0.25" min="0" inputmode="decimal"/></div>
        <div><label>Default cost ($)</label><input type="number" id="masterCost" placeholder="0.50" step="0.01" min="0" inputmode="decimal"/></div>
        <div><label>Reorder point</label><input type="number" id="masterReorder" placeholder="12" min="0" inputmode="numeric"/>
          <span style="font-size:10px;color:#aaa;margin-top:2px;display:block">Alert when below this qty</span>
        </div>
      </div>
      <div class="flex-row">
        <button class="success" onclick="saveMasterItem()" id="saveItemBtn">&#x2795; Add Item</button>
        <button onclick="cancelItemEdit()" id="cancelItemBtn" style="display:none">Cancel</button>
      </div>
    </div>
    <div class="card">
      <div class="section-hdr">
        <h3 style="margin-bottom:0">&#x1F4CB; All items</h3>
        <select id="itemCatFilter" onchange="renderMasterItems()" style="width:auto;font-size:13px;padding:5px 8px">
          <option value="all">All categories</option>
          <option value="drink">Drinks</option>
          <option value="snack">Snacks</option>
        </select>
      </div>
      <div id="masterItemList"><p class="muted" style="font-size:13px">No items yet.</p></div>
    </div>
  </div>

  <!-- LOCATIONS -->
  <div id="pane-locations" style="display:none">
    <div class="card">
      <h3 style="margin-bottom:.75rem" id="locFormTitle">&#x2795; Add new location</h3>
      <div class="grid-2" style="margin-bottom:10px">
        <div><label>Location name</label><input type="text" id="locNameInput" placeholder="e.g. Main Street Office"/></div>
        <div><label>Address / notes (optional)</label><input type="text" id="locAddress" placeholder="e.g. 123 Main St"/></div>
      </div>
      <div class="flex-row">
        <button class="success" onclick="saveLocation()" id="saveLocBtn">&#x2795; Add Location</button>
        <button onclick="cancelLocEdit()" id="cancelLocBtn" style="display:none">Cancel</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:.75rem">&#x1F4CD; All locations</h3>
      <div id="locationList"><p class="muted" style="font-size:13px">No locations yet. Add one above.</p></div>
    </div>
  </div>
</div>

<!-- Mobile bottom nav -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="showTab('sheet')" id="nav-sheet"><span class="nav-icon">&#x1F4CB;</span>Sheet</button>
  <button class="nav-btn" onclick="showTab('history')" id="nav-history"><span class="nav-icon">&#x1F4C5;</span>History</button>
  <button class="nav-btn" onclick="showTab('monthly')" id="nav-monthly"><span class="nav-icon">&#x1F4CA;</span>Monthly</button>
  <button class="nav-btn" onclick="showTab('inventory')" id="nav-inventory"><span class="nav-icon">&#x1F4E6;</span>Inventory</button>
  <button class="nav-btn" onclick="showTab('items')" id="nav-items"><span class="nav-icon">&#x1F4DD;</span>Items</button>
  <button class="nav-btn" onclick="showTab('locations')" id="nav-locations"><span class="nav-icon">&#x1F4CD;</span>Locations</button>
</nav>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, deleteDoc, query, orderBy, limit }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxlrEqi41cmnb5HzoFRnLsSi68Tno6eLk",
  authDomain: "vendin-machine-routes.firebaseapp.com",
  projectId: "vendin-machine-routes",
  storageBucket: "vendin-machine-routes.firebasestorage.app",
  messagingSenderId: "1040142766651",
  appId: "1:1040142766651:web:900f3f10a729f59deac21e"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

let loc='', locations={}, masterItems={}, warehouse={}, machines={}, invLogEntries=[], allReports=[], slots=[], prevRestockMap={};
let editingItemId=null, editingLocId=null;

// ── Helpers ───────────────────────────────────────────────────
function showStatus(msg,type='info'){const b=document.getElementById('statusBar');b.textContent=msg;b.className='status-bar '+type;setTimeout(()=>{b.className='status-bar';},4000);}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500);}
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
function fmtDate(ts){const d=new Date(ts);return(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function slugId(name){return name.trim().toLowerCase().replace(/[^a-z0-9]/g,'_').replace(/_+/g,'_');}

// ── Firebase ──────────────────────────────────────────────────
async function loadLocations(){
  locations={};
  try{const snap=await getDocs(collection(db,'locations'));snap.forEach(d=>{locations[d.id]={id:d.id,...d.data()};});}catch(e){}
  // If no locations exist yet, seed defaults
  if(!Object.keys(locations).length){
    const defaults=[{id:'loc_1',name:'Location 1',address:''},{id:'loc_2',name:'Location 2',address:''},{id:'loc_3',name:'Location 3',address:''},{id:'loc_4',name:'Location 4',address:''},{id:'loc_5',name:'Location 5',address:''}];
    for(const l of defaults){await setDoc(doc(db,'locations',l.id),l);locations[l.id]=l;}
  }
  if(!loc||!locations[loc]) loc=Object.keys(locations).sort()[0]||'';
}
async function saveLocationDB(l){await setDoc(doc(db,'locations',l.id),l);}
async function deleteLocationDB(id){await deleteDoc(doc(db,'locations',id));}

async function loadMasterItems(){masterItems={};try{const snap=await getDocs(collection(db,'masterItems'));snap.forEach(d=>{masterItems[d.id]={id:d.id,...d.data()};});}catch(e){}}
async function saveMasterItemDB(item){await setDoc(doc(db,'masterItems',item.id),item);}
async function deleteMasterItemDB(id){await deleteDoc(doc(db,'masterItems',id));}

async function loadWarehouse(){warehouse={};try{const snap=await getDocs(collection(db,'warehouse'));snap.forEach(d=>{warehouse[d.id]={id:d.id,...d.data()};});}catch(e){}}
async function saveWarehouseItem(item){await setDoc(doc(db,'warehouse',item.id),item);}
async function deleteWarehouseItem(id){await deleteDoc(doc(db,'warehouse',id));delete warehouse[id];}

async function loadMachines(){machines={};try{const snap=await getDocs(collection(db,'machines'));snap.forEach(d=>{machines[d.id]={id:d.id,...d.data()};});}catch(e){}}
async function saveMachineDoc(locId){const data=machines[locId]||{id:locId};await setDoc(doc(db,'machines',locId),data);}
async function deleteMachineItem(locId,itemId){if(machines[locId]&&machines[locId][itemId]){delete machines[locId][itemId];await saveMachineDoc(locId);}}

async function loadInvLog(){invLogEntries=[];try{const snap=await getDocs(query(collection(db,'invLog'),orderBy('timestamp','desc'),limit(60)));snap.forEach(d=>invLogEntries.push({id:d.id,...d.data()}));}catch(e){}}
async function addInvLogEntry(entry){try{const ref=await addDoc(collection(db,'invLog'),entry);invLogEntries.unshift({id:ref.id,...entry});if(invLogEntries.length>60)invLogEntries.pop();}catch(e){}}

async function loadAllReports(){allReports=[];try{const snap=await getDocs(query(collection(db,'reports'),orderBy('timestamp','desc')));snap.forEach(d=>allReports.push({id:d.id,...d.data()}));}catch(e){}}
async function loadSlots(){
  slots=[];
  try{const s=await getDoc(doc(db,'slots',loc));if(s.exists())slots=s.data().slots||[];}catch(e){}
  if(!slots.length) slots=[{slot:'A1',itemId:'',arrival:'',restock:'',price:'',cost:''},{slot:'A2',itemId:'',arrival:'',restock:'',price:'',cost:''},{slot:'B1',itemId:'',arrival:'',restock:'',price:'',cost:''},{slot:'B2',itemId:'',arrival:'',restock:'',price:'',cost:''}];
  slots=slots.map(s=>({...s,arrival:'',restock:''}));
  slots.sort((a,b)=>(a.slot||'').localeCompare(b.slot||'',undefined,{numeric:true,sensitivity:'base'}));
  buildPrevRestockMap();renderAll();showPrevRestockNote();
}
async function saveSlotsDB(){try{await setDoc(doc(db,'slots',loc),{slots});}catch(e){}}

// ── Locations ─────────────────────────────────────────────────
function buildLocationOptions(selectedId, includeAll=false){
  const locs=Object.values(locations).sort((a,b)=>a.name.localeCompare(b.name));
  let opts=includeAll?'<option value="all">All locations</option>':'';
  opts+=locs.map(l=>`<option value="${l.id}"${l.id===selectedId?' selected':''}>${l.name}</option>`).join('');
  return opts;
}

function updateAllLocationDropdowns(){
  ['locSel','histLoc','monthLoc','invLocFilter'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;

window.addPurchase=async function(){
  const itemIdVal=document.getElementById('invItemSel').value;
  const qty=parseInt(document.getElementById('invQtyBuy').value);
  const pricePaid=parseFloat(document.getElementById('invCostBuy').value);
  const reorderOverride=parseInt(document.getElementById('invReorderBuy').value);
  if(!itemIdVal||!qty||qty<1||isNaN(pricePaid)){alert('Please fill in item, quantity, and price paid.');return;}
  const it=masterItems[itemIdVal];if(!it)return;
  const existing=warehouse[itemIdVal]||{id:itemIdVal,qty:0,avgCost:0,reorder:it.reorder||0};
  const totalUnits=existing.qty+qty;
  existing.avgCost=totalUnits>0?Math.round(((existing.qty*existing.avgCost)+(qty*pricePaid))/totalUnits*1000)/1000:pricePaid;
  existing.qty=totalUnits;
  existing.reorder=!isNaN(reorderOverride)?reorderOverride:existing.reorder;
  warehouse[itemIdVal]=existing;
  await saveWarehouseItem(existing);
  await addInvLogEntry({type:'buy',itemId:itemIdVal,itemName:it.name,qty,cost:pricePaid,avgCost:existing.avgCost,timestamp:Date.now(),note:'Purchased '+qty+' @ $'+pricePaid.toFixed(2)+' ea. Avg cost: $'+existing.avgCost.toFixed(3)});
  document.getElementById('invQtyBuy').value='';
  document.getElementById('invCostBuy').value='';
  document.getElementById('invReorderBuy').value='';
  renderInventory();
  toast(qty+' '+it.name+' added! Avg cost: $'+existing.avgCost.toFixed(3));
};

window.editWarehouseQty=async function(id){
  const w=warehouse[id];if(!w)return;
  const it=masterItems[id];
  const val=prompt('Edit warehouse qty for '+(it?it.name:id)+'\nCurrent: '+w.qty+'\n\nEnter new quantity OR use +/- to adjust (e.g. +10 or -5):');
  if(val===null)return;
  let newQty;
  if(val.startsWith('+')||val.startsWith('-')){newQty=Math.max(0,w.qty+parseInt(val));}
  else{newQty=Math.max(0,parseInt(val));}
  if(isNaN(newQty)){alert('Invalid number.');return;}
  const diff=newQty-w.qty;
  w.qty=newQty;
  await saveWarehouseItem(w);
  await addInvLogEntry({type:'adjust',itemId:id,itemName:it?it.name:id,qty:Math.abs(diff),timestamp:Date.now(),note:'Manual warehouse adjustment: '+(diff>=0?'+':'')+diff+' units (now '+newQty+')'});
  renderInventory();
  toast('Warehouse qty updated.');
};

function renderInventory(){
  // Build total map: warehouse + all machines combined
  const totalMap={};
  Object.values(warehouse).forEach(w=>{
    if(!masterItems[w.id])return;
    if(!totalMap[w.id])totalMap[w.id]={id:w.id,name:masterItems[w.id].name,qty:0,reorder:w.reorder||masterItems[w.id].reorder||0};
    totalMap[w.id].qty+=w.qty;
  });
  Object.values(machines).forEach(mData=>{
    Object.values(mData).filter(m=>m.itemId&&masterItems[m.itemId]).forEach(m=>{
      if(!totalMap[m.itemId])totalMap[m.itemId]={id:m.itemId,name:masterItems[m.itemId].name,qty:0,reorder:masterItems[m.itemId].reorder||0};
      totalMap[m.itemId].qty+=m.qty;
      totalMap[m.itemId].machQty=(totalMap[m.itemId].machQty||0)+m.qty;
    });
  });
  const totals=Object.values(totalMap).sort((a,b)=>a.name.localeCompare(b.name));

  // Low stock count
  const lowCount=totals.filter(t=>t.reorder>0&&t.qty<=t.reorder).length;
  const lowEl=document.getElementById('invLowCount');
  if(lowEl){lowEl.textContent=lowCount>0?'⚠️ '+lowCount+' low':'';lowEl.style.display=lowCount>0?'block':'none';}

  const div=document.getElementById('totalStockList');
  if(!totals.length){div.innerHTML='<p class="muted" style="font-size:13px">No inventory yet. Add items on the Items tab, then add stock via visit reports.</p>';return;}
  div.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 72px 72px 72px 36px;gap:4px;font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.3px;padding:0 0 6px;border-bottom:1px solid #f0ede8;margin-bottom:4px">
      <span>Item</span><span style="text-align:center">Warehouse</span><span style="text-align:center">Machines</span><span style="text-align:center">Total</span><span></span>
    </div>`+totals.map(t=>{
      const whQty=warehouse[t.id]?warehouse[t.id].qty:0;
      const machQty=t.machQty||0;
      const total=t.qty;
      const isLow=t.reorder>0&&total<=t.reorder;
      const isOut=total===0;
      return`<div class="total-row" style="display:grid;grid-template-columns:1fr 72px 72px 72px 36px;gap:4px;align-items:center">
        <div style="font-weight:500">${t.name}${isOut?'<span class="stock-badge stock-out" style="margin-left:6px">Out</span>':isLow?'<span class="stock-badge stock-low" style="margin-left:6px">Low</span>':''}</div>
        <div style="text-align:center;color:#888">${whQty}</div>
        <div style="text-align:center;color:#1a6fc4">${Math.max(0,machQty)}</div>
        <div style="text-align:center;font-weight:700" class="${isOut?'red':isLow?'orange':'green'}">${total}</div>
        <div><button class="sm primary" onclick="editTotalQty('${t.id}')">&#x270F;&#xFE0F;</button></div>
      </div>`;
    }).join('');
}

window.editTotalQty=async function(itemId){
  const it=masterItems[itemId];if(!it)return;
  // Get current total
  let whQty=(warehouse[itemId]?warehouse[itemId].qty:0);
  let machQty=0;
  Object.values(machines).forEach(mData=>{if(mData[itemId])machQty+=mData[itemId].qty;});
  const currentTotal=whQty+machQty;
  const val=prompt('Update total qty for '+it.name+'\nCurrent total: '+currentTotal+'\n\nEnter new total quantity:');
  if(val===null)return;
  const newTotal=parseInt(val);
  if(isNaN(newTotal)||newTotal<0){alert('Please enter a valid number.');return;}
  // Apply the difference to the warehouse entry (create if needed)
  const diff=newTotal-currentTotal;
  if(!warehouse[itemId])warehouse[itemId]={id:itemId,qty:0,avgCost:0,reorder:it.reorder||0};
  warehouse[itemId].qty=Math.max(0,warehouse[itemId].qty+diff);
  await saveWarehouseItem(warehouse[itemId]);
  renderInventory();
  toast(it.name+' updated to '+newTotal+' units.');
};

function buildPrevRestockMap(){
  prevRestockMap={};
  const locReps=allReports.filter(r=>r.loc===loc).sort((a,b)=>b.timestamp-a.timestamp);
  if(!locReps.length)return;
  (locReps[0].lineItems||[]).forEach(l=>{if(l.itemId&&l.restock!==''&&l.restock!==null)prevRestockMap[l.itemId]=parseFloat(l.restock);});
}
function getPrevRestock(iId){return prevRestockMap.hasOwnProperty(iId)?prevRestockMap[iId]:null;}
function calcSold(s){const a=parseFloat(s.arrival);if(isNaN(a))return null;const p=getPrevRestock(s.itemId);if(p===null)return null;return Math.max(0,p-a);}
function calcRow(s){const sold=calcSold(s);const price=parseFloat(s.price)||0,cost=parseFloat(s.cost)||0;return{sold,rev:sold!==null?sold*price:null,profit:sold!==null?sold*(price-cost):null};}

function showPrevRestockNote(){
  const note=document.getElementById('prevRestockNote');
  const locReps=allReports.filter(r=>r.loc===loc).sort((a,b)=>b.timestamp-a.timestamp);
  if(!locReps.length){note.style.display='block';note.innerHTML='ℹ️ <strong>First visit.</strong> Enter qty & restock — sold tracks automatically next visit.';}
  else{note.style.display='block';note.innerHTML='📌 Sold = last restock − today\'s arrival. Last visit: <strong>'+locReps[0].date+'</strong>';}
}

}

function updateRowCalcs(i){
  const s=slots[i];const{sold,rev,profit}=calcRow(s);const prev=getPrevRestock(s.itemId);
  const ms=document.getElementById('m-sold-'+i);const mr=document.getElementById('m-rev-'+i);const mp=document.getElementById('m-prof-'+i);
  if(ms){ms.textContent=sold!==null?sold:prev===null?'—*':'—';ms.style.color=sold!==null&&sold>0?'#1a6b2a':'#888';}
  if(mr)mr.textContent=rev!==null?'$'+rev.toFixed(2):'—';
  if(mp){mp.textContent=profit!==null?'$'+profit.toFixed(2):'—';mp.style.color=profit===null?'#888':profit<0?'#a32d2d':'#1a6b2a';}
  const ds=document.getElementById('d-sold-'+i);const dr=document.getElementById('d-rev-'+i);const dp=document.getElementById('d-prof-'+i);
  if(ds)ds.innerHTML=sold!==null?`<span class="green">${sold}</span>`:prev===null?'<span class="muted">—*</span>':'—';
  if(dr)dr.textContent=rev!==null?'$'+rev.toFixed(2):'—';
  if(dp)dp.innerHTML=profit!==null?`<span class="${profit<0?'red':'green'}">$${profit.toFixed(2)}</span>`:'—';
}

function renderTotals(){
  let totSold=0,totRev=0,totProfit=0,has=false;
  slots.forEach(s=>{const{sold,rev,profit}=calcRow(s);if(sold!==null){totSold+=sold;totRev+=rev;totProfit+=profit;has=true;}});
  const ts=document.getElementById('tot-sold');const tr=document.getElementById('tot-rev');const tp=document.getElementById('tot-profit');
  if(ts)ts.textContent=has?totSold:'—';if(tr)tr.textContent=has?'$'+totRev.toFixed(2):'—';
  if(tp){tp.textContent=has?'$'+totProfit.toFixed(2):'—';tp.className=has&&totProfit<0?'red':'green';}
}

window.onItemSelect=function(i,iId){
  slots[i].itemId=iId;
  if(iId&&masterItems[iId]){
    const it=masterItems[iId];
    if(!slots[i].price)slots[i].price=it.price;
    if(warehouse[iId]&&warehouse[iId].avgCost)slots[i].cost=warehouse[iId].avgCost;
    else if(!slots[i].cost)slots[i].cost=it.cost;
  }
  buildPrevRestockMap();renderAll();
};

document.addEventListener('input',function(e){
  const inp=e.target.closest('[data-field]');if(!inp||inp.tagName==='SELECT')return;
  const i=parseInt(inp.dataset.idx);const f=inp.dataset.field;slots[i][f]=inp.value;
  buildPrevRestockMap();updateRowCalcs(i);renderTotals();
});
document.addEventListener('click',function(e){
  const rb=e.target.closest('[data-remove-idx]');
  if(rb){const i=parseInt(rb.dataset.removeIdx);if(confirm('Remove slot?')){slots.splice(i,1);renderAll();}return;}
  const db2=e.target.closest('[data-delete-id]');
  if(db2){window.deleteReport(db2.getAttribute('data-delete-id'));return;}
});

window.switchLoc=async function(){
  loc=document.getElementById('locSel').value;
  await loadSlots();
};
window.addSlot=function(){slots.push({slot:'',itemId:'',arrival:'',restock:'',price:'',cost:''});renderAll();setTimeout(()=>{const c=document.querySelectorAll('.slot-card');if(c.length)c[c.length-1].scrollIntoView({behavior:'smooth',block:'center'});},100);};
window.saveSheet=async function(){await saveSlotsDB();toast('Sheet saved!');};

window.submitReport=async function(){
  const dateVal=document.getElementById('visitDate').value;
  if(!dateVal){alert('Please select a visit date.');return;}
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Saving...';
  try{
    const d=new Date(dateVal+'T12:00:00');
    const dateLabel=MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
    const monthKey=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const locName=locations[loc]?locations[loc].name:'Location';
    let totSold=0,totRev=0,totProfit=0;
    const lineItems=slots.filter(s=>s.itemId||s.slot).map(s=>{
      const{sold,rev,profit}=calcRow(s);const prev=getPrevRestock(s.itemId);
      const it=s.itemId&&masterItems[s.itemId]?masterItems[s.itemId]:null;
      if(sold!==null){totSold+=sold;totRev+=rev;totProfit+=profit;}
      return{slot:s.slot,itemId:s.itemId,item:it?it.name:s.itemId,arrival:s.arrival,restock:s.restock,prevRestock:prev!==null?prev:null,price:parseFloat(s.price)||0,cost:parseFloat(s.cost)||0,sold,rev,profit};
    });
    await addDoc(collection(db,'reports'),{date:dateLabel,dateVal,monthKey,loc,name:locName,lineItems,totSold,totRev,totProfit,timestamp:Date.now()});
    await saveSlotsDB();
    await updateInventoryFromReport(lineItems,loc);
    showStatus('Report saved for '+locName+' — '+dateLabel,'success');
    await loadAllReports();buildPrevRestockMap();renderAll();showPrevRestockNote();renderInventory();
    showTab('history');
  }catch(e){showStatus('Error: '+e.message,'error');console.error(e);}
  btn.disabled=false;btn.innerHTML='📄 Submit Report';
};

async function updateInventoryFromReport(lineItems,reportLoc){
  for(const l of lineItems){
    if(!l.itemId)continue;
    const arrival=parseFloat(l.arrival);const restock=parseFloat(l.restock);
    const it=masterItems[l.itemId];const locName=locations[reportLoc]?locations[reportLoc].name:'Location';
    const loaded=(!isNaN(restock)&&!isNaN(arrival))?Math.max(0,restock-arrival):0;
    if(!isNaN(restock)&&restock>=0){
      if(!machines[reportLoc])machines[reportLoc]={id:reportLoc};
      if(!machines[reportLoc][l.itemId])machines[reportLoc][l.itemId]={itemId:l.itemId,qty:0};
      machines[reportLoc][l.itemId].qty=restock;
      await saveMachineDoc(reportLoc);
    }
    if(loaded>0&&warehouse[l.itemId]){
      warehouse[l.itemId].qty=Math.max(0,warehouse[l.itemId].qty-loaded);
      await saveWarehouseItem(warehouse[l.itemId]);
      await addInvLogEntry({type:'move',itemId:l.itemId,itemName:it?it.name:l.itemId,qty:loaded,loc:reportLoc,locName,timestamp:Date.now(),note:'Loaded '+loaded+' into machine at '+locName});
    }
    if(l.sold!==null&&l.sold!==undefined&&l.sold>0){
      await addInvLogEntry({type:'sold',itemId:l.itemId,itemName:it?it.name:l.itemId,qty:l.sold,loc:reportLoc,locName,timestamp:Date.now(),note:'Sold '+l.sold+' at '+locName});
    }
  }
}

window.deleteReport=async function(reportId){
  if(!confirm('Delete this report? Cannot be undone.'))return;
  try{await deleteDoc(doc(db,'reports',reportId));await loadAllReports();buildPrevRestockMap();renderAll();showPrevRestockNote();renderHistory();toast('Report deleted.');}catch(e){showStatus('Error: '+e.message,'error');}
};

window.renderHistory=function(){
  const filterLoc=document.getElementById('histLoc').value;
  const filtered=filterLoc==='all'?allReports:allReports.filter(r=>r.loc===filterLoc);
  const div=document.getElementById('historyList');
  if(!filtered.length){div.innerHTML='<p class="muted" style="font-size:13px;padding:1rem 0">No reports yet.</p>';return;}
  div.innerHTML=filtered.map(r=>`
    <div class="history-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.75rem;gap:8px">
        <div><div style="font-weight:700;font-size:15px">${r.name}</div><div class="muted" style="font-size:12px;margin-top:2px">${r.date}</div></div>
        <button class="danger-solid sm" data-delete-id="${r.id}">🗑 Delete</button>
      </div>
      <div style="display:flex;gap:12px;font-size:13px;flex-wrap:wrap;margin-bottom:.75rem">
        <span><strong>${r.totSold}</strong> units</span>
        <span><strong>$${parseFloat(r.totRev||0).toFixed(2)}</strong> revenue</span>
        <span class="${r.totProfit<0?'red':'green'}"><strong>$${parseFloat(r.totProfit||0).toFixed(2)}</strong> profit</span>
      </div>
      <div>${(r.lineItems||[]).map(l=>`
        <div class="history-item-row">
          <div><div style="font-weight:500">${l.item||l.itemId}</div><div class="muted" style="font-size:11px">Slot ${l.slot}</div></div>
          <div style="display:flex;gap:5px;align-items:center">
            <span class="qty-badge qty-arr">${l.arrival||'—'}</span>
            <span class="muted" style="font-size:11px">→</span>
            <span class="qty-badge qty-rst">${l.restock||'—'}</span>
            <span class="muted" style="font-size:11px">·</span>
            <span class="qty-badge qty-sold">${l.sold!==null?l.sold+' sold':'—'}</span>
          </div>
        </div>`).join('')}
      </div>
    </div>`).join('');
};

function populateMonthSelector(){
  const keys=new Set(allReports.map(r=>r.monthKey));
  const today=new Date();keys.add(today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0'));
  const sorted=[...keys].sort().reverse();
  const sel=document.getElementById('monthSel');const cur=sel.value;
  sel.innerHTML=sorted.map(k=>{const[y,m]=k.split('-');return`<option value="${k}"${k===cur?' selected':''}>${MONTHS[parseInt(m)-1]} ${y}</option>`;}).join('');
  if(!sel.value&&sorted.length)sel.value=sorted[0];
}

window.renderMonthly=function(){
  const monthKey=document.getElementById('monthSel').value;
  const filterLoc=document.getElementById('monthLoc').value;
  if(!monthKey)return;
  const[y,m]=monthKey.split('-');const monthLabel=MONTHS[parseInt(m)-1]+' '+y;
  const filtered=allReports.filter(r=>r.monthKey===monthKey&&(filterLoc==='all'||r.loc===filterLoc));
  const itemMap={};
  filtered.forEach(r=>{(r.lineItems||[]).forEach(l=>{if((!l.item&&!l.itemId)||l.sold===null||l.sold===undefined)return;const key=(l.itemId||l.item).toLowerCase();if(!itemMap[key])itemMap[key]={name:l.item||l.itemId,sold:0,rev:0,profit:0,visits:0};itemMap[key].sold+=l.sold;itemMap[key].rev+=l.rev||0;itemMap[key].profit+=l.profit||0;if(l.sold>0)itemMap[key].visits++;});});
  const items=Object.values(itemMap).sort((a,b)=>b.sold-a.sold);
  const totSold=items.reduce((s,i)=>s+i.sold,0),totRev=items.reduce((s,i)=>s+i.rev,0),totProfit=items.reduce((s,i)=>s+i.profit,0);
  const maxSold=items.length?Math.max(items[0].sold,1):1;
  const div=document.getElementById('monthlyContent');
  if(!items.length){div.innerHTML='<div class="card"><p class="muted" style="font-size:13px">No reports for '+monthLabel+'.</p></div>';return;}
  const top3=items.slice(0,Math.min(3,items.length));const bot3=items.length>3?items.slice(-Math.min(3,items.length)).reverse():[];
  div.innerHTML=`
    <div class="stat-grid">
      <div class="stat"><div class="stat-label">Units sold</div><div class="stat-value">${totSold}</div></div>
      <div class="stat"><div class="stat-label">Revenue</div><div class="stat-value">$${totRev.toFixed(2)}</div></div>
      <div class="stat"><div class="stat-label">Profit</div><div class="stat-value ${totProfit<0?'red':'green'}">$${totProfit.toFixed(2)}</div></div>
      <div class="stat"><div class="stat-label">Visits</div><div class="stat-value">${filtered.length}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.75rem">
      <div class="card" style="border-color:#2d7a2d"><h3 style="color:#1a6b2a;margin-bottom:.5rem">⬆ Top sellers</h3>
        ${top3.map(it=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px"><span style="font-weight:600">${it.name}</span><span class="green">${it.sold}</span></div><div class="bar-wrap"><div class="bar" style="width:${Math.round(it.sold/maxSold*100)}%;background:#2d7a2d"></div></div></div>`).join('')}
      </div>
      ${bot3.length?`<div class="card" style="border-color:#c0392b"><h3 style="color:#a32d2d;margin-bottom:.5rem">⬇ Slowest</h3>${bot3.map(it=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px"><span style="font-weight:600">${it.name}</span><span class="red">${it.sold}</span></div><div class="bar-wrap"><div class="bar" style="width:${Math.round(it.sold/maxSold*100)}%;background:#c0392b"></div></div></div>`).join('')}</div>`:''}
    </div>
    <div class="card"><h2 style="margin-bottom:.75rem">All items — ${monthLabel}</h2>
      ${items.map((it,i)=>{
        const margin=it.rev>0?Math.round(it.profit/it.rev*100):null;
        const mColor=margin===null?'#888':margin>=50?'#1a6b2a':margin>=25?'#856404':margin>=0?'#555':'#a32d2d';
        const mBg=margin===null?'transparent':margin>=50?'#d4edda':margin>=25?'#fff3cd':margin>=0?'#f4f4f0':'#fde8e8';
        return`<div class="monthly-row">
          <div><div style="font-weight:${i<3?'700':'400'};font-size:14px">${it.name}${i===0?'<span class="badge badge-top">top</span>':i===items.length-1?'<span class="badge badge-low">low</span>':''}</div>
          <div class="muted" style="font-size:11px">${it.visits} visit${it.visits!==1?'s':''} · ${it.sold} units</div></div>
          <div style="display:flex;gap:10px;align-items:center;flex-shrink:0">
            <div style="text-align:right"><div style="font-size:13px;font-weight:600">$${it.rev.toFixed(2)}</div><div style="font-size:11px" class="${it.profit<0?'red':'green'}">$${it.profit.toFixed(2)} profit</div></div>
            <span style="background:${mBg};color:${mColor};padding:3px 8px;border-radius:99px;font-size:12px;font-weight:700;min-width:44px;text-align:center">${margin!==null?margin+'%':'—'}</span>
          </div>
        </div>`;
      }).join('')}
    </div>`;
};

window.showTab=async function(t){
  ['sheet','history','monthly','inventory','items','locations'].forEach(n=>{
    document.getElementById('pane-'+n).style.display=n===t?'':'none';
    const nb=document.getElementById('nav-'+n);if(nb)nb.classList.toggle('active',n===t);
    const db3=document.getElementById('dtab-'+n);if(db3)db3.classList.toggle('active',n===t);
  });
  if(t==='history'){await loadAllReports();buildPrevRestockMap();renderHistory();}
  if(t==='monthly'){await loadAllReports();populateMonthSelector();renderMonthly();}
  if(t==='inventory'){await loadWarehouse();await loadMachines();renderInventory();}
  if(t==='items')renderMasterItems();
  if(t==='locations')renderLocationList();
};

async function init(){
  document.getElementById('visitDate').value=new Date().toISOString().split('T')[0];
  showStatus('Connecting...','info');
  await loadLocations();
  await loadMasterItems();
  await loadWarehouse();
  await loadMachines();
  await loadAllReports();
  renderInventory();
  updateAllLocationDropdowns();
  updateAllItemDropdowns();
  await loadSlots();
  populateMonthSelector();
  showStatus('Connected! Data saves automatically.','success');
}
init();
</script>
</body>
</html>
