<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vending Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;background:#f0ede8;min-height:100vh;padding-bottom:80px}
h1{font-size:20px;font-weight:700;margin-bottom:1rem}
h2{font-size:16px;font-weight:600;margin-bottom:.75rem}
h3{font-size:14px;font-weight:600;margin-bottom:.5rem}
.container{max-width:700px;margin:0 auto;padding:1rem}
.card{background:#fff;border:1px solid #e0ddd5;border-radius:14px;padding:1rem;margin-bottom:.75rem}
label{font-size:12px;color:#666;display:block;margin-bottom:4px;font-weight:500}
select,input[type="text"],input[type="number"],input[type="date"]{padding:10px 12px;border-radius:10px;border:1.5px solid #ddd;background:#fff;color:#1a1a1a;font-size:16px;font-family:inherit;width:100%;outline:none;-webkit-appearance:none;appearance:none}
select:focus,input:focus{border-color:#1a6fc4;box-shadow:0 0 0 3px rgba(26,111,196,.12)}
button{padding:11px 18px;border-radius:10px;border:1.5px solid #ddd;background:#fff;cursor:pointer;font-size:15px;font-family:inherit;color:#1a1a1a;font-weight:500;transition:all .15s;-webkit-tap-highlight-color:transparent;min-height:44px}
button:active{opacity:.75;transform:scale(.97)}
button.primary{background:#1a6fc4;color:#fff;border-color:#1a6fc4}
button.success{background:#2d7a2d;color:#fff;border-color:#2d7a2d}
button.orange{background:#d4680a;color:#fff;border-color:#d4680a}
button.sm{padding:7px 12px;font-size:13px;min-height:36px}
button.danger-solid{background:#c0392b;color:#fff;border-color:#c0392b;padding:7px 12px;font-size:13px;min-height:36px}
button.full{width:100%;margin-bottom:8px}
button:disabled{opacity:.5}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0ddd5;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;border:none;background:transparent;cursor:pointer;color:#888;font-size:10px;font-weight:500;gap:3px;min-height:56px;-webkit-tap-highlight-color:transparent}
.nav-btn.active{color:#1a6fc4}
.nav-icon{font-size:20px;line-height:1}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.75rem}
.stat{background:#f4f4f0;border-radius:10px;padding:.65rem .85rem}
.stat-label{font-size:11px;color:#888;margin-bottom:2px}
.stat-value{font-size:20px;font-weight:700}
.slot-card{background:#f9f8f6;border:1.5px solid #e8e4de;border-radius:12px;padding:.85rem;margin-bottom:.65rem}
.slot-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.slot-label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px}
.slot-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.input-group label{font-size:11px;color:#666;margin-bottom:3px}
.arrival-inp{background:#f0f7ee;border-color:#b8ddb0}
.restock-inp{background:#e8f3ff;border-color:#a8cff0}
.calc-row{display:flex;gap:6px;margin-top:6px;background:#f4f4f0;border-radius:8px;padding:6px 8px;align-items:center}
.calc-item{flex:1;text-align:center}
.calc-label{font-size:10px;color:#888;margin-bottom:1px}
.calc-val{font-size:14px;font-weight:700}
.prev-tag{font-size:10px;color:#aaa;display:block;margin-top:2px;text-align:center}
.green{color:#1a6b2a;font-weight:700}
.red{color:#a32d2d;font-weight:700}
.orange-text{color:#d4680a;font-weight:700}
.muted{color:#888}
.history-card{background:#fff;border:1px solid #e0ddd5;border-radius:14px;padding:1rem;margin-bottom:.75rem}
.history-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.75rem;gap:8px}
.history-stats{display:flex;gap:12px;font-size:13px;flex-wrap:wrap;margin-bottom:.75rem}
.history-item-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f0ede8;font-size:13px}
.history-item-row:last-child{border-bottom:none}
.item-qty-badges{display:flex;gap:5px;align-items:center}
.qty-badge{padding:2px 7px;border-radius:6px;font-size:12px;font-weight:600}
.qty-arr{background:#f0f7ee;color:#2d6b20}
.qty-rst{background:#e8f3ff;color:#1a5c9e}
.qty-sold{background:#fff3cd;color:#7a5200}
.top-bot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.75rem}
.bar-wrap{background:#e8e6e0;border-radius:4px;height:6px;overflow:hidden;margin-top:4px}
.bar{height:6px;border-radius:4px}
.badge{display:inline-block;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:600;margin-left:4px}
.badge-top{background:#d4edda;color:#1a6b2a}
.badge-low{background:#fde8e8;color:#a32d2d}
.monthly-item-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0ede8;font-size:13px;gap:8px}
.monthly-item-row:last-child{border-bottom:none}
.monthly-item-right{display:flex;gap:10px;align-items:center;flex-shrink:0}
/* Inventory tab */
.inv-item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0ede8;gap:8px}
.inv-item-row:last-child{border-bottom:none}
.inv-name{font-weight:600;font-size:14px}
.inv-meta{font-size:11px;color:#888;margin-top:2px}
.inv-qty{font-size:22px;font-weight:700;text-align:right}
.inv-qty-label{font-size:10px;color:#888;text-align:right}
.stock-badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.stock-ok{background:#d4edda;color:#1a6b2a}
.stock-low{background:#fff3cd;color:#856404}
.stock-out{background:#fde8e8;color:#a32d2d}
.log-entry{padding:8px 0;border-bottom:1px solid #f0ede8;font-size:13px}
.log-entry:last-child{border-bottom:none}
.log-type-buy{color:#1a6b2a;font-weight:600}
.log-type-use{color:#1a6fc4;font-weight:600}
.status-bar{border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:.75rem;display:none}
.status-bar.error{background:#fde8e8;border:1px solid #c0392b;display:block}
.status-bar.success{background:#d4edda;border:1px solid #2d7a2d;display:block}
.status-bar.info{background:#e8f3ff;border:1px solid #1a6fc4;display:block}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 22px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.note-bar{background:#fff8e1;border:1px solid #f0c040;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:.75rem}
.section-actions{display:flex;flex-direction:column;gap:8px}
.flex-row{display:flex;gap:8px}
.flex-row button{flex:1}
.divider{border:none;border-top:1px solid #f0ede8;margin:.75rem 0}
@media(min-width:650px){
  .slot-card-desktop{display:block}
  .slot-cards-mobile{display:none}
  table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
  thead th{font-weight:600;font-size:11px;color:#666;text-align:left;padding:6px 5px;border-bottom:1px solid #ddd;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
  tbody td{padding:5px;vertical-align:middle;border-bottom:1px solid #f0ede8}
  tbody tr:last-child td{border-bottom:none}
  tfoot td{padding:6px 5px;border-top:1px solid #ddd;font-weight:600;font-size:13px}
  .arrival-col{background:#f0f7ee}
  .restock-col{background:#e8f3ff}
  .overflow{overflow-x:auto}
  .bottom-nav{display:none}
  .desktop-tabs{display:flex!important}
  body{padding-bottom:0}
}
@media(max-width:649px){
  .slot-card-desktop{display:none}
  .slot-cards-mobile{display:block}
  .desktop-tabs{display:none!important}
}
.desktop-tabs{display:none;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
.desktop-tab{padding:8px 18px;border-radius:10px;border:1.5px solid #ddd;background:#fff;cursor:pointer;font-size:14px;color:#666;font-weight:500}
.desktop-tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
</style>
</head>
<body>
<div class="container">
  <div id="statusBar" class="status-bar"></div>
  <h1>&#x1F3EA; Vending Tracker</h1>

  <div class="desktop-tabs" id="desktopTabs">
    <button class="desktop-tab active" onclick="showTab('sheet')" id="dtab-sheet">&#x1F4CB; Visit Sheet</button>
    <button class="desktop-tab" onclick="showTab('history')" id="dtab-history">&#x1F4C5; History</button>
    <button class="desktop-tab" onclick="showTab('monthly')" id="dtab-monthly">&#x1F4CA; Monthly</button>
    <button class="desktop-tab" onclick="showTab('inventory')" id="dtab-inventory">&#x1F4E6; Inventory</button>
  </div>

  <!-- VISIT SHEET -->
  <div id="pane-sheet">
    <div class="card">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div>
          <label>Location</label>
          <select id="locSel" onchange="switchLoc()">
            <option value="1">Location 1</option><option value="2">Location 2</option>
            <option value="3">Location 3</option><option value="4">Location 4</option>
            <option value="5">Location 5</option>
          </select>
        </div>
        <div>
          <label>Visit date</label>
          <input type="date" id="visitDate"/>
        </div>
      </div>
      <div>
        <label>Location name</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="locName" placeholder="e.g. Main Street Office"/>
          <button class="sm" onclick="saveLocName()" style="white-space:nowrap">&#x2713; Save</button>
        </div>
      </div>
    </div>
    <div id="prevRestockNote" class="note-bar" style="display:none"></div>
    <div class="slot-cards-mobile" id="slotCardsMobile"></div>
    <div class="slot-card-desktop">
      <div class="card">
        <div class="overflow">
          <table>
            <colgroup>
              <col style="width:50px"><col style="width:auto">
              <col style="width:78px"><col style="width:78px">
              <col style="width:68px"><col style="width:68px">
              <col style="width:54px"><col style="width:76px"><col style="width:76px"><col style="width:34px">
            </colgroup>
            <thead><tr>
              <th>Slot</th><th>Item</th>
              <th style="text-align:center;background:#f0f7ee">Arrival<br><span style="font-size:9px;font-weight:400">(left)</span></th>
              <th style="text-align:center;background:#e8f3ff">Restock<br><span style="font-size:9px;font-weight:400">(filled to)</span></th>
              <th style="text-align:right">Price</th>
              <th style="text-align:right">Cost</th>
              <th style="text-align:center">Sold</th>
              <th style="text-align:right">Revenue</th>
              <th style="text-align:right">Profit</th>
              <th></th>
            </tr></thead>
            <tbody id="slotBody"></tbody>
            <tfoot><tr>
              <td colspan="6" class="muted" style="font-size:12px">Totals</td>
              <td id="tot-sold" style="text-align:center"></td>
              <td id="tot-rev" style="text-align:right"></td>
              <td id="tot-profit" style="text-align:right"></td>
              <td></td>
            </tr></tfoot>
          </table>
        </div>
      </div>
    </div>
    <div class="section-actions">
      <button onclick="addSlot()" style="border-style:dashed">+ Add Slot</button>
      <div class="flex-row">
        <button class="primary" onclick="saveSheet()">&#x1F4BE; Save Sheet</button>
        <button class="success" onclick="submitReport()" id="submitBtn">&#x1F4C4; Submit Report</button>
      </div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="pane-history" style="display:none">
    <div style="margin-bottom:.75rem">
      <label>Filter by location</label>
      <select id="histLoc" onchange="renderHistory()">
        <option value="all">All locations</option>
        <option value="1">Location 1</option><option value="2">Location 2</option>
        <option value="3">Location 3</option><option value="4">Location 4</option>
        <option value="5">Location 5</option>
      </select>
    </div>
    <div id="historyList"><p class="muted" style="font-size:13px">Loading...</p></div>
  </div>

  <!-- MONTHLY -->
  <div id="pane-monthly" style="display:none">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:.75rem">
      <div><label>Month</label><select id="monthSel" onchange="renderMonthly()"></select></div>
      <div>
        <label>Location</label>
        <select id="monthLoc" onchange="renderMonthly()">
          <option value="all">All locations</option>
          <option value="1">Location 1</option><option value="2">Location 2</option>
          <option value="3">Location 3</option><option value="4">Location 4</option>
          <option value="5">Location 5</option>
        </select>
      </div>
    </div>
    <div id="monthlyContent"><p class="muted" style="font-size:13px">Loading...</p></div>
  </div>

  <!-- INVENTORY -->
  <div id="pane-inventory" style="display:none">
    <!-- Add purchase -->
    <div class="card">
      <h3 style="margin-bottom:.75rem">&#x2795; Add purchased stock</h3>
      <div class="slot-grid-2" style="margin-bottom:8px">
        <div>
          <label>Item name</label>
          <input type="text" id="invItemName" placeholder="e.g. Coke Can" list="invItemSuggestions"/>
          <datalist id="invItemSuggestions"></datalist>
        </div>
        <div>
          <label>Qty purchased</label>
          <input type="number" id="invQtyBuy" placeholder="24" min="1" inputmode="numeric"/>
        </div>
      </div>
      <div class="slot-grid-2" style="margin-bottom:10px">
        <div>
          <label>Unit cost ($)</label>
          <input type="number" id="invCostBuy" placeholder="0.50" step="0.05" min="0" inputmode="decimal"/>
        </div>
        <div>
          <label>Reorder point</label>
          <input type="number" id="invReorder" placeholder="12" min="0" inputmode="numeric"/>
          <span style="font-size:10px;color:#aaa;margin-top:2px;display:block">Alert me when below this qty</span>
        </div>
      </div>
      <button class="success full" onclick="addPurchase()">&#x2795; Add to Inventory</button>
    </div>

    <!-- Current inventory -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
        <h3 style="margin-bottom:0">&#x1F4E6; Current inventory</h3>
        <span id="invLowCount" style="font-size:12px;color:#a32d2d;font-weight:600;display:none"></span>
      </div>
      <div id="invList"><p class="muted" style="font-size:13px">No inventory yet. Add purchased stock above.</p></div>
    </div>

    <!-- Log -->
    <div class="card">
      <h3 style="margin-bottom:.75rem">&#x1F4CB; Recent activity</h3>
      <div id="invLog"><p class="muted" style="font-size:13px">No activity yet.</p></div>
    </div>
  </div>
</div>

<!-- Mobile bottom nav -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="showTab('sheet')" id="nav-sheet">
    <span class="nav-icon">&#x1F4CB;</span>Sheet
  </button>
  <button class="nav-btn" onclick="showTab('history')" id="nav-history">
    <span class="nav-icon">&#x1F4C5;</span>History
  </button>
  <button class="nav-btn" onclick="showTab('monthly')" id="nav-monthly">
    <span class="nav-icon">&#x1F4CA;</span>Monthly
  </button>
  <button class="nav-btn" onclick="showTab('inventory')" id="nav-inventory">
    <span class="nav-icon">&#x1F4E6;</span>Inventory
  </button>
</nav>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, deleteDoc, updateDoc, query, orderBy, limit }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxlrEqi41cmnb5HzoFRnLsSi68Tno6eLk",
  authDomain: "vendin-machine-routes.firebaseapp.com",
  projectId: "vendin-machine-routes",
  storageBucket: "vendin-machine-routes.firebasestorage.app",
  messagingSenderId: "1040142766651",
  appId: "1:1040142766651:web:900f3f10a729f59deac21e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
let loc='1', locNames={}, slots=[], allReports=[], prevRestockMap={};
let inventory={}, invLog=[];

function showStatus(msg,type='info'){
  const bar=document.getElementById('statusBar');
  bar.textContent=msg; bar.className='status-bar '+type;
  setTimeout(()=>{bar.className='status-bar';},4000);
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
function fmtDate(ts){const d=new Date(ts);return(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}

// ── Firebase: visits ──────────────────────────────────────────
async function loadLocNames(){try{const s=await getDoc(doc(db,'settings','locNames'));if(s.exists())locNames=s.data();}catch(e){}}
async function saveLocNamesToDB(){try{await setDoc(doc(db,'settings','locNames'),locNames);}catch(e){}}
async function loadAllReports(){
  allReports=[];
  try{const snap=await getDocs(query(collection(db,'reports'),orderBy('timestamp','desc')));snap.forEach(d=>allReports.push({id:d.id,...d.data()}));}catch(e){console.error(e);}
}
async function loadSlots(){
  slots=[];
  try{const s=await getDoc(doc(db,'slots','loc'+loc));if(s.exists())slots=s.data().slots||[];}catch(e){}
  if(!slots.length) slots=[
    {slot:'A1',item:'',arrival:'',restock:'',price:'',cost:''},
    {slot:'A2',item:'',arrival:'',restock:'',price:'',cost:''},
    {slot:'B1',item:'',arrival:'',restock:'',price:'',cost:''},
    {slot:'B2',item:'',arrival:'',restock:'',price:'',cost:''},
  ];
  slots=slots.map(s=>({...s,arrival:'',restock:''}));
  document.getElementById('locName').value=locNames[loc]||'';
  buildPrevRestockMap();
  renderAll();
  showPrevRestockNote();
}
async function saveSlotsDB(){try{await setDoc(doc(db,'slots','loc'+loc),{slots});}catch(e){}}

// ── Firebase: inventory ───────────────────────────────────────
async function loadInventory(){
  inventory={};invLog=[];
  try{
    const snap=await getDocs(collection(db,'inventory'));
    snap.forEach(d=>{inventory[d.id]={id:d.id,...d.data()};});
  }catch(e){console.error(e);}
  try{
    const snap=await getDocs(query(collection(db,'invLog'),orderBy('timestamp','desc'),limit(50)));
    snap.forEach(d=>invLog.push({id:d.id,...d.data()}));
  }catch(e){console.error(e);}
}
async function saveInventoryItem(item){
  await setDoc(doc(db,'inventory',item.id),item);
}
async function addInvLog(entry){
  const ref=await addDoc(collection(db,'invLog'),entry);
  invLog.unshift({id:ref.id,...entry});
  if(invLog.length>50) invLog.pop();
}

// ── Inventory: add purchase ───────────────────────────────────
window.addPurchase=async function(){
  const name=document.getElementById('invItemName').value.trim();
  const qty=parseInt(document.getElementById('invQtyBuy').value);
  const cost=parseFloat(document.getElementById('invCostBuy').value)||0;
  const reorder=parseInt(document.getElementById('invReorder').value)||0;
  if(!name||!qty||qty<1){alert('Please enter an item name and quantity.');return;}
  const id=name.toLowerCase().replace(/[^a-z0-9]/g,'_');
  const existing=inventory[id]||{id,name,qty:0,cost,reorder};
  existing.qty+=qty;
  existing.cost=cost||existing.cost;
  existing.reorder=reorder||existing.reorder;
  existing.name=name;
  inventory[id]=existing;
  await saveInventoryItem(existing);
  await addInvLog({type:'buy',item:name,qty,cost,timestamp:Date.now(),note:'Purchase: +'+qty+' units'});
  document.getElementById('invItemName').value='';
  document.getElementById('invQtyBuy').value='';
  document.getElementById('invCostBuy').value='';
  document.getElementById('invReorder').value='';
  renderInventory();
  updateInvSuggestions();
  toast(qty+' '+name+' added to inventory!');
};

// ── Inventory: manual adjustment ─────────────────────────────
window.adjustInv=async function(id,delta,note){
  if(!inventory[id]) return;
  inventory[id].qty=Math.max(0,inventory[id].qty+delta);
  await saveInventoryItem(inventory[id]);
  await addInvLog({type:delta>0?'buy':'use',item:inventory[id].name,qty:Math.abs(delta),timestamp:Date.now(),note});
  renderInventory();
};

window.deleteInvItem=async function(id){
  if(!confirm('Remove '+inventory[id].name+' from inventory?')) return;
  try{await deleteDoc(doc(db,'inventory',id));}catch(e){}
  delete inventory[id];
  renderInventory();
  toast('Item removed.');
};

// ── Deduct from inventory when report submitted ───────────────
// Only deduct what was SOLD (prev restock - arrival qty) not what was refilled
async function deductInventoryForReport(lineItems){
  for(const l of lineItems){
    if(!l.item) continue;
    // sold = what customers actually bought = previous restock - arrival qty
    const sold=l.sold;
    if(sold===null||sold===undefined||isNaN(sold)||sold<=0) continue;
    const id=l.item.trim().toLowerCase().replace(/[^a-z0-9]/g,'_');
    if(inventory[id]){
      inventory[id].qty=Math.max(0,inventory[id].qty-sold);
      await saveInventoryItem(inventory[id]);
      await addInvLog({type:'use',item:l.item,qty:sold,timestamp:Date.now(),note:'Sold at machine: -'+sold+' units'});
    }
  }
}

// ── Prev restock logic ────────────────────────────────────────
function buildPrevRestockMap(){
  prevRestockMap={};
  const locReports=allReports.filter(r=>r.loc===loc).sort((a,b)=>b.timestamp-a.timestamp);
  if(!locReports.length) return;
  (locReports[0].lineItems||[]).forEach(l=>{
    if(l.item&&l.restock!==''&&l.restock!==null&&l.restock!==undefined)
      prevRestockMap[itemKey(l.slot,l.item)]=parseFloat(l.restock);
  });
}
function itemKey(slot,item){return(slot||'').trim().toLowerCase()+'|'+(item||'').trim().toLowerCase();}
function getPrevRestock(slot,item){const k=itemKey(slot,item);return prevRestockMap.hasOwnProperty(k)?prevRestockMap[k]:null;}
function calcSold(s){const arrival=parseFloat(s.arrival);if(isNaN(arrival))return null;const prev=getPrevRestock(s.slot,s.item);if(prev===null)return null;return Math.max(0,prev-arrival);}
function calcRow(s){
  const sold=calcSold(s);
  const price=parseFloat(s.price)||0,cost=parseFloat(s.cost)||0;
  return{sold,rev:sold!==null?sold*price:null,profit:sold!==null?sold*(price-cost):null};
}
function showPrevRestockNote(){
  const note=document.getElementById('prevRestockNote');
  const locReports=allReports.filter(r=>r.loc===loc).sort((a,b)=>b.timestamp-a.timestamp);
  if(!locReports.length){note.style.display='block';note.innerHTML='&#x2139;&#xFE0F; <strong>First visit.</strong> Enter qty and restock — sold tracks automatically next visit.';}
  else{note.style.display='block';note.innerHTML='&#x1F4CC; Sold = last restock minus today\'s arrival. Last visit: <strong>'+locReports[0].date+'</strong>';}
}

function updateRowCalcs(i){
  const s=slots[i];const{sold,rev,profit}=calcRow(s);const prev=getPrevRestock(s.slot,s.item);
  const mSold=document.getElementById('m-sold-'+i);const mRev=document.getElementById('m-rev-'+i);const mProf=document.getElementById('m-prof-'+i);

  if(mProf){mProf.textContent=profit!==null?'$'+profit.toFixed(2):'—';mProf.style.color=profit===null?'#888':profit<0?'#a32d2d':'#1a6b2a';}

function renderTotals(){
  let totSold=0,totRev=0,totProfit=0,has=false;
  slots.forEach(s=>{const{sold,rev,profit}=calcRow(s);if(sold!==null){totSold+=sold;totRev+=rev;totProfit+=profit;has=true;}});
  const ts=document.getElementById('tot-sold');const tr=document.getElementById('tot-rev');const tp=document.getElementById('tot-profit');
  if(ts) ts.textContent=has?totSold:'—';
  if(tr) tr.textContent=has?'$'+totRev.toFixed(2):'—';
  if(tp){tp.textContent=has?'$'+totProfit.toFixed(2):'—';tp.className=has&&totProfit<0?'red':'green';}
}

window.submitReport=async function(){
  const dateVal=document.getElementById('visitDate').value;
  if(!dateVal){alert('Please select a visit date.');return;}
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='Saving...';
  try{
    const d=new Date(dateVal+'T12:00:00');
    const dateLabel=MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
    const monthKey=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const name=locNames[loc]||'Location '+loc;
    let totSold=0,totRev=0,totProfit=0;
    const lineItems=slots.filter(s=>s.item).map(s=>{
      const{sold,rev,profit}=calcRow(s);
      const prev=getPrevRestock(s.slot,s.item);
      if(sold!==null){totSold+=sold;totRev+=rev;totProfit+=profit;}
      return{slot:s.slot,item:s.item,arrival:s.arrival,restock:s.restock,prevRestock:prev!==null?prev:null,price:parseFloat(s.price)||0,cost:parseFloat(s.cost)||0,sold,rev,profit};
    });
    await addDoc(collection(db,'reports'),{date:dateLabel,dateVal,monthKey,loc,name,lineItems,totSold,totRev,totProfit,timestamp:Date.now()});
    await saveSlotsDB();
    // Deduct from inventory: what was physically added to the machine
    await deductInventoryForReport(lineItems);
    showStatus('Report saved for '+name+' — '+dateLabel+'. Inventory updated automatically.','success');
    await loadAllReports();
    buildPrevRestockMap();renderAll();showPrevRestockNote();
    renderInventory();
    showTab('history');
  }catch(e){showStatus('Error: '+e.message,'error');}
  btn.disabled=false;btn.innerHTML='&#x1F4C4; Submit Report';
};

window.deleteReport=async function(reportId){
  if(!confirm('Delete this report? Cannot be undone.')) return;
  try{
    await deleteDoc(doc(db,'reports',reportId));
    await loadAllReports();buildPrevRestockMap();renderAll();showPrevRestockNote();renderHistory();
    toast('Report deleted.');
  }catch(e){showStatus('Error deleting: '+e.message,'error');}
};

      <div class="card" style="border-color:#2d7a2d">
        <h3 style="color:#1a6b2a;margin-bottom:.5rem">&#x2B06; Top sellers</h3>
        ${top3.map(it=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px"><span style="font-weight:600">${it.name}</span><span class="green">${it.sold}</span></div><div class="bar-wrap"><div class="bar" style="width:${Math.round(it.sold/maxSold*100)}%;background:#2d7a2d"></div></div></div>`).join('')}

window.showTab=async function(t){
  ['sheet','history','monthly','inventory'].forEach(n=>{
    document.getElementById('pane-'+n).style.display=n===t?'':'none';

  });
  if(t==='history'){await loadAllReports();buildPrevRestockMap();renderHistory();}
  if(t==='monthly'){await loadAllReports();populateMonthSelector();renderMonthly();}
  if(t==='inventory'){await loadInventory();renderInventory();updateInvSuggestions();}
};

async function init(){
  document.getElementById('visitDate').value=new Date().toISOString().split('T')[0];
  showStatus('Connecting...','info');
  await loadLocNames();
  await loadAllReports();
  await loadInventory();
  await loadSlots();
  populateMonthSelector();
  updateInvSuggestions();
  showStatus('Connected! Data saves automatically.','success');
}
init();
</script>
