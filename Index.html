<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vending Tracker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;background:#f4f4f0;min-height:100vh;padding:1.5rem}
  h1{font-size:22px;font-weight:600;margin-bottom:1.25rem}
  h2{font-size:16px;font-weight:600;margin-bottom:.75rem}
  h3{font-size:14px;font-weight:600;margin-bottom:.5rem}
  .container{max-width:980px;margin:0 auto}
  .card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
  label{font-size:12px;color:#666;display:block;margin-bottom:3px}
  select,input[type="text"],input[type="number"],input[type="date"]{padding:7px 10px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#1a1a1a;font-size:13px;font-family:inherit;width:100%;outline:none}
  select:focus,input:focus{border-color:#1a6fc4;box-shadow:0 0 0 2px rgba(26,111,196,.15)}
  button{padding:7px 16px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:13px;font-family:inherit;color:#1a1a1a;transition:background .15s}
  button:hover{background:#f0ede8}
  button.primary{background:#1a6fc4;color:#fff;border-color:#1a6fc4}
  button.primary:hover{background:#155aa0}
  button.success{background:#2d7a2d;color:#fff;border-color:#2d7a2d}
  button.success:hover{background:#246024}
  button.sm{padding:4px 9px;font-size:12px}
  button.danger{color:#c0392b;border-color:#e8b4b0}
  button.danger:hover{background:#fdf0ef}
  button.danger-solid{background:#c0392b;color:#fff;border-color:#c0392b;padding:4px 10px;font-size:12px}
  button.danger-solid:hover{background:#a32d2d}
  button:disabled{opacity:.5;cursor:not-allowed}
  .tab-bar{display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:13px;color:#666}
  .tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a;font-weight:500}
  .tab:hover:not(.active){background:#f0ede8}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:1rem}
  .stat{background:#f4f4f0;border-radius:8px;padding:.7rem 1rem}
  .stat-label{font-size:11px;color:#888;margin-bottom:3px}
  .stat-value{font-size:22px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
  thead th{font-weight:600;font-size:11px;color:#666;text-align:left;padding:6px 5px;border-bottom:1px solid #ddd;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
  tbody td{padding:5px;vertical-align:middle;border-bottom:1px solid #f0ede8}
  tbody tr:last-child td{border-bottom:none}
  tfoot td{padding:6px 5px;border-top:1px solid #ddd;font-weight:600;font-size:13px}
  .arrival-col{background:#f0f7ee}
  .restock-col{background:#e8f3ff}
  .bar-wrap{background:#e8e6e0;border-radius:4px;height:8px;overflow:hidden;min-width:40px}
  .bar{height:8px;border-radius:4px}
  .badge{display:inline-block;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:600;margin-left:4px}
  .badge-top{background:#d4edda;color:#1a6b2a}
  .badge-low{background:#fde8e8;color:#a32d2d}
  .flex{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:1rem}
  .flex-1{flex:1;min-width:130px}
  .flex-2{flex:2;min-width:160px}
  .green{color:#1a6b2a;font-weight:600}
  .red{color:#a32d2d}
  .muted{color:#888}
  .hint{font-size:11px;color:#aaa;font-style:italic}
  .top-card{border-color:#2d7a2d}
  .bot-card{border-color:#c0392b}
  .top-title{color:#1a6b2a}
  .bot-title{color:#a32d2d}
  .row-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .overflow{overflow-x:auto}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 22px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
  .toast.show{opacity:1}
  .status-bar{border-radius:8px;padding:8px 14px;font-size:13px;margin-bottom:1rem;display:none}
  .status-bar.error{background:#fde8e8;border:1px solid #c0392b;display:block}
  .status-bar.success{background:#d4edda;border:1px solid #2d7a2d;display:block}
  .status-bar.info{background:#e8f3ff;border:1px solid #1a6fc4;display:block}
  .prev-tag{font-size:11px;color:#888;display:block;margin-top:2px}
  @media(max-width:600px){body{padding:.75rem}.flex{flex-direction:column}.flex-1,.flex-2{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="container">
  <div id="statusBar" class="status-bar"></div>
  <h1>&#x1F3EA; Vending Tracker</h1>
  <div class="tab-bar">
    <button class="tab active" onclick="showTab('sheet')" id="tab-sheet">&#x1F4CB; Visit Sheet</button>
    <button class="tab" onclick="showTab('history')" id="tab-history">&#x1F4C5; Visit History</button>
    <button class="tab" onclick="showTab('monthly')" id="tab-monthly">&#x1F4CA; Monthly Sales</button>
  </div>

  <!-- VISIT SHEET -->
  <div id="pane-sheet">
    <div class="flex">
      <div class="flex-1">
        <label>Location</label>
        <select id="locSel" onchange="switchLoc()">
          <option value="1">Location 1</option><option value="2">Location 2</option>
          <option value="3">Location 3</option><option value="4">Location 4</option>
          <option value="5">Location 5</option>
        </select>
      </div>
      <div class="flex-2">
        <label>Location name</label>
        <div style="display:flex;gap:6px">
          <input type="text" id="locName" placeholder="e.g. Main Street Office"/>
          <button class="sm" onclick="saveLocName()">&#x2713; Save</button>
        </div>
      </div>
      <div class="flex-1">
        <label>Visit date</label>
        <input type="date" id="visitDate"/>
      </div>
    </div>

    <div id="prevRestockNote" style="display:none;background:#fff8e1;border:1px solid #f0c040;border-radius:8px;padding:8px 14px;font-size:13px;margin-bottom:1rem"></div>

    <div class="card">
      <div class="overflow">
        <table>
          <colgroup>
            <col style="width:50px"><col style="width:auto">
            <col style="width:80px"><col style="width:80px">
            <col style="width:68px"><col style="width:68px">
            <col style="width:55px"><col style="width:78px"><col style="width:78px"><col style="width:34px">
          </colgroup>
          <thead><tr>
            <th>Slot</th><th>Item</th>
            <th style="text-align:center;background:#f0f7ee">Arrival qty<br><span style="font-size:10px;font-weight:400;color:#999">(what's left)</span></th>
            <th style="text-align:center;background:#e8f3ff">Restock qty<br><span style="font-size:10px;font-weight:400;color:#999">(filled to)</span></th>
            <th style="text-align:right">Sell price</th>
            <th style="text-align:right">Item cost</th>
            <th style="text-align:center">Sold</th>
            <th style="text-align:right">Revenue</th>
            <th style="text-align:right">Profit</th>
            <th></th>
          </tr></thead>
          <tbody id="slotBody"></tbody>
          <tfoot><tr>
            <td colspan="6" class="muted" style="font-size:12px">Totals</td>
            <td id="tot-sold" style="text-align:center"></td>
            <td id="tot-rev" style="text-align:right"></td>
            <td id="tot-profit" style="text-align:right"></td>
            <td></td>
          </tr></tfoot>
        </table>
      </div>
      <div class="row-actions">
        <button onclick="addSlot()">+ Add Slot</button>
        <button class="primary" onclick="saveSheet()">&#x1F4BE; Save Sheet</button>
        <button class="success" onclick="submitReport()" id="submitBtn">&#x1F4C4; Submit Visit Report</button>
      </div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="pane-history" style="display:none">
    <div class="flex">
      <div class="flex-1">
        <label>Filter by location</label>
        <select id="histLoc" onchange="renderHistory()">
          <option value="all">All locations</option>
          <option value="1">Location 1</option><option value="2">Location 2</option>
          <option value="3">Location 3</option><option value="4">Location 4</option>
          <option value="5">Location 5</option>
        </select>
      </div>
    </div>
    <div id="historyList"><p class="muted" style="font-size:13px">Loading...</p></div>
  </div>

  <!-- MONTHLY -->
  <div id="pane-monthly" style="display:none">
    <div class="flex">
      <div class="flex-1">
        <label>Month</label>
        <select id="monthSel" onchange="renderMonthly()"></select>
      </div>
      <div class="flex-1">
        <label>Location</label>
        <select id="monthLoc" onchange="renderMonthly()">
          <option value="all">All locations</option>
          <option value="1">Location 1</option><option value="2">Location 2</option>
          <option value="3">Location 3</option><option value="4">Location 4</option>
          <option value="5">Location 5</option>
        </select>
      </div>
    </div>
    <div id="monthlyContent"><p class="muted" style="font-size:13px">Loading...</p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, deleteDoc, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxlrEqi41cmnb5HzoFRnLsSi68Tno6eLk",
  authDomain: "vendin-machine-routes.firebaseapp.com",
  projectId: "vendin-machine-routes",
  storageBucket: "vendin-machine-routes.firebasestorage.app",
  messagingSenderId: "1040142766651",
  appId: "1:1040142766651:web:900f3f10a729f59deac21e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

let loc='1', locNames={}, slots=[], allReports=[];
// prevRestock: map of slotKey (loc+slot+item) -> last restock qty from previous report
let prevRestockMap={};

function showStatus(msg,type='info'){
  const bar=document.getElementById('statusBar');
  bar.textContent=msg; bar.className='status-bar '+type;
  setTimeout(()=>{bar.className='status-bar';},4000);
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');}

// ── Firebase helpers ──────────────────────────────────────────
async function loadLocNames(){
  try{const s=await getDoc(doc(db,'settings','locNames'));if(s.exists())locNames=s.data();}catch(e){}
}
async function saveLocNamesToDB(){
  try{await setDoc(doc(db,'settings','locNames'),locNames);}catch(e){}
}
async function loadAllReports(){
  allReports=[];
  try{
    const snap=await getDocs(query(collection(db,'reports'),orderBy('timestamp','desc')));
    snap.forEach(d=>allReports.push({id:d.id,...d.data()}));
  }catch(e){console.error(e);}
}
async function loadSlots(){
  slots=[];
  try{const s=await getDoc(doc(db,'slots','loc'+loc));if(s.exists())slots=s.data().slots||[];}catch(e){}
  if(!slots.length) slots=[
    {slot:'A1',item:'',arrival:'',restock:'',price:'',cost:''},
    {slot:'A2',item:'',arrival:'',restock:'',price:'',cost:''},
    {slot:'B1',item:'',arrival:'',restock:'',price:'',cost:''},
    {slot:'B2',item:'',arrival:'',restock:'',price:'',cost:''},
  ];
  document.getElementById('locName').value=locNames[loc]||'';
  buildPrevRestockMap();
  renderSheet();
  showPrevRestockNote();
}
async function saveSlotsDB(){
  try{await setDoc(doc(db,'slots','loc'+loc),{slots});}catch(e){}
}

// ── Previous restock logic ────────────────────────────────────
// Find the most recent report for this location and build a map
// of item -> restocked qty, so we can calculate sold = prevRestock - arrivalQty
function buildPrevRestockMap(){
  prevRestockMap={};
  const locReports=allReports.filter(r=>r.loc===loc).sort((a,b)=>b.timestamp-a.timestamp);
  if(!locReports.length) return;
  const last=locReports[0];
  (last.lineItems||[]).forEach(l=>{
    if(l.item && l.restock!=='' && l.restock!==null && l.restock!==undefined){
      const key=itemKey(l.slot,l.item);
      prevRestockMap[key]=parseFloat(l.restock);
    }
  });
}

function itemKey(slot,item){
  return (slot||'').trim().toLowerCase()+'|'+(item||'').trim().toLowerCase();
}

function getPrevRestock(slot,item){
  if(!slot&&!item) return null;
  const k=itemKey(slot,item);
  return prevRestockMap.hasOwnProperty(k)?prevRestockMap[k]:null;
}

function calcSold(s){
  // Sold = last restock qty - this arrival qty
  const arrival=parseFloat(s.arrival);
  if(isNaN(arrival)) return null;
  const prev=getPrevRestock(s.slot,s.item);
  if(prev===null) return null; // no previous report to compare against
  return Math.max(0, prev - arrival);
}

function calcRow(s){
  const sold=calcSold(s);
  const price=parseFloat(s.price)||0;
  const cost=parseFloat(s.cost)||0;
  const rev=sold!==null?sold*price:null;
  const profit=sold!==null?sold*(price-cost):null;
  return{sold,rev,profit};
}

function showPrevRestockNote(){
  const note=document.getElementById('prevRestockNote');
  const locReports=allReports.filter(r=>r.loc===loc).sort((a,b)=>b.timestamp-a.timestamp);
  if(!locReports.length){
    note.style.display='block';
    note.innerHTML='&#x2139;&#xFE0F; <strong>First visit for this location.</strong> Enter arrival qty and restock qty — sold will calculate automatically on your next visit using today\'s restock as the baseline.';
  } else {
    const last=locReports[0];
    note.style.display='block';
    note.innerHTML='&#x1F4CC; Sold counts calculated from last visit restock on <strong>'+last.date+'</strong>. Enter today\'s arrival qty to see what sold.';
  }
}

// ── Sheet rendering ───────────────────────────────────────────
function renderSheet(){
  document.getElementById('slotBody').innerHTML=slots.map((s,i)=>{
    const{sold,rev,profit}=calcRow(s);
    const prev=getPrevRestock(s.slot,s.item);
    const prevLabel=prev!==null?`<span class="prev-tag">prev stocked: ${prev}</span>`:'<span class="prev-tag">—</span>';
    const soldStr=sold!==null?`<span class="green">${sold}</span>`:prev===null?'<span class="muted" title="Submit a report first to establish baseline">—*</span>':'—';
    const revStr=rev!==null?'$'+rev.toFixed(2):'—';
    const profStr=profit!==null?`<span class="${profit<0?'red':'green'}">$${profit.toFixed(2)}</span>`:'—';
    return`<tr>
      <td><input type="text" value="${esc(s.slot)}" placeholder="A1" oninput="upd(${i},'slot',this.value)"/></td>
      <td><input type="text" value="${esc(s.item)}" placeholder="Item name" oninput="upd(${i},'item',this.value)"/></td>
      <td class="arrival-col">
        <input type="number" value="${esc(s.arrival)}" placeholder="0" min="0" style="text-align:center" oninput="upd(${i},'arrival',this.value)"/>
        ${prevLabel}
      </td>
      <td class="restock-col"><input type="number" value="${esc(s.restock)}" placeholder="0" min="0" style="text-align:center" oninput="upd(${i},'restock',this.value)"/></td>
      <td><input type="number" value="${esc(s.price)}" placeholder="1.50" step="0.25" min="0" style="text-align:right" oninput="upd(${i},'price',this.value)"/></td>
      <td><input type="number" value="${esc(s.cost)}" placeholder="0.50" step="0.05" min="0" style="text-align:right" oninput="upd(${i},'cost',this.value)"/></td>
      <td style="text-align:center">${soldStr}</td>
      <td style="text-align:right">${revStr}</td>
      <td style="text-align:right">${profStr}</td>
      <td><button class="sm danger" onclick="removeSlot(${i})">&#x2715;</button></td>
    </tr>`;
  }).join('');
  renderTotals();
}

function renderTotals(){
  let totSold=0,totRev=0,totProfit=0,has=false;
  slots.forEach(s=>{
    const{sold,rev,profit}=calcRow(s);
    if(sold!==null){totSold+=sold;totRev+=rev;totProfit+=profit;has=true;}
  });
  document.getElementById('tot-sold').textContent=has?totSold:'—';
  document.getElementById('tot-rev').textContent=has?'$'+totRev.toFixed(2):'—';
  const el=document.getElementById('tot-profit');
  el.textContent=has?'$'+totProfit.toFixed(2):'—';
  el.className=has&&totProfit<0?'red':'green';
}

// ── Window-exposed functions ──────────────────────────────────
window.switchLoc=async function(){
  loc=document.getElementById('locSel').value;
  await loadSlots();
};
window.saveLocName=async function(){
  locNames[loc]=document.getElementById('locName').value.trim();
  await saveLocNamesToDB(); toast('Location name saved!');
};
window.upd=function(i,f,v){
  slots[i][f]=v;
  // Rebuild prev map in case slot/item changed
  buildPrevRestockMap();
  renderSheet();
};
window.addSlot=function(){slots.push({slot:'',item:'',arrival:'',restock:'',price:'',cost:''});renderSheet();};
window.removeSlot=function(i){if(confirm('Remove this slot?')){slots.splice(i,1);renderSheet();}};

window.saveSheet=async function(){
  await saveSlotsDB(); toast('Sheet saved!');
};

window.submitReport=async function(){
  const dateVal=document.getElementById('visitDate').value;
  if(!dateVal){alert('Please select a visit date first.');return;}
  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='Saving...';
  try{
    const d=new Date(dateVal+'T12:00:00');
    const dateLabel=MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
    const monthKey=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const name=locNames[loc]||'Location '+loc;
    let totSold=0,totRev=0,totProfit=0;
    const lineItems=slots.filter(s=>s.item).map(s=>{
      const{sold,rev,profit}=calcRow(s);
      const prev=getPrevRestock(s.slot,s.item);
      if(sold!==null){totSold+=sold;totRev+=rev;totProfit+=profit;}
      return{
        slot:s.slot, item:s.item,
        arrival:s.arrival, restock:s.restock,
        prevRestock:prev!==null?prev:null,
        price:parseFloat(s.price)||0, cost:parseFloat(s.cost)||0,
        sold, rev, profit
      };
    });
    await addDoc(collection(db,'reports'),{
      date:dateLabel,dateVal,monthKey,loc,name,lineItems,
      totSold,totRev,totProfit,timestamp:Date.now()
    });
    await saveSlotsDB();
    showStatus('Report for '+name+' on '+dateLabel+' saved!','success');
    await loadAllReports();
    buildPrevRestockMap();
    renderSheet();
    showPrevRestockNote();
    showTab('history');
  }catch(e){
    showStatus('Error: '+e.message,'error');
  }
  btn.disabled=false; btn.innerHTML='&#x1F4C4; Submit Visit Report';
};

window.deleteReport=async function(reportId){
  if(!confirm('Delete this report? This cannot be undone.')) return;
  try{
    await deleteDoc(doc(db,'reports',reportId));
    await loadAllReports();
    buildPrevRestockMap();
    renderSheet();
    showPrevRestockNote();
    renderHistory();
    toast('Report deleted.');
  }catch(e){
    showStatus('Error deleting: '+e.message,'error');
  }
};

// ── History tab ───────────────────────────────────────────────
window.renderHistory=function(){
  const filterLoc=document.getElementById('histLoc').value;
  const filtered=filterLoc==='all'?allReports:allReports.filter(r=>r.loc===filterLoc);
  const div=document.getElementById('historyList');
  if(!filtered.length){div.innerHTML='<p class="muted" style="font-size:13px">No visit reports yet.</p>';return;}
  div.innerHTML=filtered.map(r=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <div>
          <span style="font-weight:600;font-size:15px">${r.name}</span>
          <span class="muted" style="font-size:12px;margin-left:8px">${r.date}</span>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <span style="font-size:13px">${r.totSold} units &nbsp;·&nbsp; $${parseFloat(r.totRev||0).toFixed(2)} rev &nbsp;·&nbsp; <span class="${r.totProfit<0?'red':'green'}">$${parseFloat(r.totProfit||0).toFixed(2)} profit</span></span>
          <button class="danger-solid" onclick="deleteReport('${r.id}')">&#x1F5D1; Delete</button>
        </div>
      </div>
      <div class="overflow">
        <table>
          <thead><tr>
            <th style="width:48px">Slot</th><th>Item</th>
            <th style="text-align:center;width:72px;background:#fff3cd">Prev stocked</th>
            <th style="text-align:center;width:72px;background:#f0f7ee">Arrival qty</th>
            <th style="text-align:center;width:72px;background:#e8f3ff">Restocked to</th>
            <th style="text-align:center;width:54px">Sold</th>
            <th style="text-align:right;width:78px">Revenue</th>
            <th style="text-align:right;width:78px">Profit</th>
          </tr></thead>
          <tbody>${(r.lineItems||[]).map(l=>`<tr>
            <td>${l.slot}</td><td>${l.item}</td>
            <td style="text-align:center;background:#fff3cd">${l.prevRestock!==null&&l.prevRestock!==undefined?l.prevRestock:'—'}</td>
            <td style="text-align:center;background:#f0f7ee">${l.arrival||'—'}</td>
            <td style="text-align:center;background:#e8f3ff">${l.restock||'—'}</td>
            <td style="text-align:center" class="${l.sold>0?'green':'muted'}">${l.sold!==null?l.sold:'—'}</td>
            <td style="text-align:right">${l.rev!==null?'$'+parseFloat(l.rev).toFixed(2):'—'}</td>
            <td style="text-align:right" class="${l.profit!==null&&l.profit<0?'red':'green'}">${l.profit!==null?'$'+parseFloat(l.profit).toFixed(2):'—'}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`).join('');
};

// ── Monthly tab ───────────────────────────────────────────────
function populateMonthSelector(){
  const keys=new Set(allReports.map(r=>r.monthKey));
  const today=new Date();
  keys.add(today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0'));
  const sorted=[...keys].sort().reverse();
  const sel=document.getElementById('monthSel');
  const cur=sel.value;
  sel.innerHTML=sorted.map(k=>{
    const[y,m]=k.split('-');
    return`<option value="${k}"${k===cur?' selected':''}>${MONTHS[parseInt(m)-1]} ${y}</option>`;
  }).join('');
  if(!sel.value&&sorted.length) sel.value=sorted[0];
}

window.renderMonthly=function(){
  const monthKey=document.getElementById('monthSel').value;
  const filterLoc=document.getElementById('monthLoc').value;
  if(!monthKey) return;
  const[y,m]=monthKey.split('-');
  const monthLabel=MONTHS[parseInt(m)-1]+' '+y;
  const filtered=allReports.filter(r=>r.monthKey===monthKey&&(filterLoc==='all'||r.loc===filterLoc));
  const itemMap={};
  filtered.forEach(r=>{
    (r.lineItems||[]).forEach(l=>{
      if(!l.item||l.sold===null||l.sold===undefined) return;
      const key=l.item.trim().toLowerCase();
      if(!itemMap[key]) itemMap[key]={name:l.item.trim(),sold:0,rev:0,profit:0,visits:0};
      itemMap[key].sold+=l.sold;
      itemMap[key].rev+=l.rev||0;
      itemMap[key].profit+=l.profit||0;
      if(l.sold>0) itemMap[key].visits++;
    });
  });
  const items=Object.values(itemMap).sort((a,b)=>b.sold-a.sold);
  const totSold=items.reduce((s,i)=>s+i.sold,0);
  const totRev=items.reduce((s,i)=>s+i.rev,0);
  const totProfit=items.reduce((s,i)=>s+i.profit,0);
  const maxSold=items.length?Math.max(items[0].sold,1):1;
  const div=document.getElementById('monthlyContent');
  if(!items.length){
    div.innerHTML='<div class="card"><p class="muted" style="font-size:13px">No reports found for '+monthLabel+'.</p></div>';
    return;
  }
  const top3=items.slice(0,Math.min(3,items.length));
  const bot3=items.length>3?items.slice(-Math.min(3,items.length)).reverse():[];
  div.innerHTML=`
    <div class="stat-grid">
      <div class="stat"><div class="stat-label">Units sold</div><div class="stat-value">${totSold}</div></div>
      <div class="stat"><div class="stat-label">Gross revenue</div><div class="stat-value">$${totRev.toFixed(2)}</div></div>
      <div class="stat"><div class="stat-label">Net profit</div><div class="stat-value ${totProfit<0?'red':'green'}">$${totProfit.toFixed(2)}</div></div>
      <div class="stat"><div class="stat-label">Visits logged</div><div class="stat-value">${filtered.length}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem">
      <div class="card top-card">
        <h3 class="top-title">&#x2B06; Top sellers</h3>
        ${top3.map(it=>`<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
            <span style="font-weight:600">${it.name}</span><span class="green">${it.sold} sold</span>
          </div>
          <div class="bar-wrap"><div class="bar" style="width:${Math.round(it.sold/maxSold*100)}%;background:#2d7a2d"></div></div>
        </div>`).join('')}
      </div>
      ${bot3.length?`<div class="card bot-card">
        <h3 class="bot-title">&#x2B07; Slowest sellers</h3>
        ${bot3.map(it=>`<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
            <span style="font-weight:600">${it.name}</span><span class="red">${it.sold} sold</span>
          </div>
          <div class="bar-wrap"><div class="bar" style="width:${Math.round(it.sold/maxSold*100)}%;background:#c0392b"></div></div>
        </div>`).join('')}
      </div>`:''}
    </div>
    <div class="card">
      <h2 style="margin-bottom:.75rem">All items — ${monthLabel}</h2>
      <div class="overflow">
        <table>
          <thead><tr>
            <th style="width:28px">#</th><th>Item</th>
            <th style="text-align:center;width:58px">Sold</th>
            <th style="width:90px">Volume</th>
            <th style="text-align:right;width:82px">Revenue</th>
            <th style="text-align:right;width:78px">Profit</th>
            <th style="text-align:right;width:82px">Margin</th>
            <th style="text-align:center;width:54px">Visits</th>
          </tr></thead>
          <tbody>${items.map((it,i)=>{
            const margin=it.rev>0?Math.round(it.profit/it.rev*100):null;
            const marginColor=margin===null?'#888':margin>=50?'#1a6b2a':margin>=25?'#856404':margin>=0?'#555':'#a32d2d';
            const marginBg=margin===null?'transparent':margin>=50?'#d4edda':margin>=25?'#fff3cd':margin>=0?'#f4f4f0':'#fde8e8';
            return`<tr>
            <td class="muted" style="font-size:11px">${i+1}</td>
            <td style="font-weight:${i<3?'600':'400'}">${it.name}${i===0?'<span class="badge badge-top">top</span>':i===items.length-1?'<span class="badge badge-low">low</span>':''}</td>
            <td style="text-align:center" class="${it.sold>0?'green':'muted'}">${it.sold}</td>
            <td><div class="bar-wrap"><div class="bar" style="width:${maxSold>0?Math.round(it.sold/maxSold*100):0}%;background:#1a6fc4"></div></div></td>
            <td style="text-align:right">$${it.rev.toFixed(2)}</td>
            <td style="text-align:right" class="${it.profit<0?'red':'green'}">$${it.profit.toFixed(2)}</td>
            <td style="text-align:right"><span style="background:${marginBg};color:${marginColor};padding:2px 7px;border-radius:99px;font-size:12px;font-weight:600">${margin!==null?margin+'%':'—'}</span></td>
            <td style="text-align:center;color:#888">${it.visits}</td>
          </tr>`;}).join('')}</tbody>
        </table>
      </div>
    </div>`;
};

window.showTab=async function(t){
  ['sheet','history','monthly'].forEach(n=>{
    document.getElementById('pane-'+n).style.display=n===t?'':'none';
    document.getElementById('tab-'+n).classList.toggle('active',n===t);
  });
  if(t==='history'){await loadAllReports();buildPrevRestockMap();renderHistory();}
  if(t==='monthly'){await loadAllReports();populateMonthSelector();renderMonthly();}
};

// ── Init ──────────────────────────────────────────────────────
async function init(){
  document.getElementById('visitDate').value=new Date().toISOString().split('T')[0];
  showStatus('Connecting to database...','info');
  await loadLocNames();
  await loadAllReports();
  await loadSlots();
  populateMonthSelector();
  showStatus('Connected! Data saves automatically.','success');
}

init();
</script>
</body>
